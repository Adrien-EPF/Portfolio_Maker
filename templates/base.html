<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock %} - Portfolio Maker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/accueil.css" />
</head>

<body>
    <nav class="home-nav">
        <span class="brand">Portfolio Maker</span>
        <a href="/"{% if request.url.path == "/" %} aria-current="page"{% endif %}>Accueil</a>
        <a href="/create"{% if request.url.path == "/create" %} aria-current="page"{% endif %}>Créer</a>
        <a href="/users"{% if request.url.path == "/users" %} aria-current="page"{% endif %}>Tous les portfolios</a>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <p>Portfolio Maker — Projet FastAPI</p>
    </footer>
</body>

</html>

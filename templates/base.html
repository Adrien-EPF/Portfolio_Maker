<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock %} - Portfolio Maker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/broadsheet.css" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
</head>

<body>
    <nav class="site-nav">
        <a class="logo brand" href="/" aria-label="Portfolio Maker, accueil">
            <span class="logo-mark" aria-hidden="true"><span>PM</span></span>
            <span class="logo-word">Portfolio Maker</span>
        </a>
        <a href="/"{% if page=="home" %} aria-current="page"{% endif %}>Accueil</a>
        <a href="/create"{% if page=="create" %} aria-current="page"{% endif %}>Créer</a>
        <a href="/users"{% if page=="users" %} aria-current="page"{% endif %}>Tous les portfolios</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <p>Portfolio Maker — Projet FastAPI</p>
    </footer>
</body>

</html>
